<div class="container">
  <!-- Header -->
  <div class="header-card">
    <div class="header-card-content">
      <div class="title-section">
        <div class="title-icon">
          <mat-icon>calendar_today</mat-icon>
        </div>
        <h1>{{ 'ADMIN_PANEL.MENU.FESTIVAL_DAYS' | translate }}</h1>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="48" color="primary"></mat-spinner>
  </div>

  <!-- Error -->
  <div *ngIf="!isLoading && errorMessage" class="error-container">
    <mat-icon>error_outline</mat-icon>
    <p>{{ errorMessage }}</p>
  </div>

  <!-- Table -->
  <div class="table-card" *ngIf="!isLoading && !errorMessage">
    <table mat-table [dataSource]="items">

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Datum</th>
        <td mat-cell *matCellDef="let day">{{ day.date | date: 'dd.MM.yyyy.' }}</td>
      </ng-container>

      
      <!-- TODO: opensAt, capacity, program kolone, po istom obrascu -->
<ng-container matColumnDef="opensAt">
        <th mat-header-cell *matHeaderCellDef>Otvaranje</th>
        <td mat-cell *matCellDef="let day">{{ day.opensAt }}</td>
      </ng-container>
      <ng-container matColumnDef="capacity">
        <th mat-header-cell *matHeaderCellDef>Kapacitet</th>
        <td mat-cell *matCellDef="let day">{{ day.capacity  }}</td>
      </ng-container>
      <ng-container matColumnDef="program">
        <th mat-header-cell *matHeaderCellDef>Program</th>
        <td mat-cell *matCellDef="let day">{{ day.program }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="data-row"></tr>
    </table>

    <div class="paginator-wrapper">
      <app-fit-paginator-bar [vm]="this"></app-fit-paginator-bar>
    </div>
  </div>
</div>
